[package]
name = "app_rust"
version = "0.1.0"
edition = "2024"

[profile.dev]
opt-level = 0          # nenhuma otimização, build mais rápida
debug = true           # mantém símbolos de debug
incremental = true     # ativa compilação incremental

[dependencies]
rand = "0.10.0-rc.8"
tracing = "0.1"
tracing-subscriber = "0.3"
sqlx = { version = "0.8", features = ["sqlite","runtime-tokio","macros","migrate"], default-features = false }
tokio = { version = "1.49.0", features = ["rt-multi-thread", "macros"] }
anyhow = "1.0.101"
