[package]
name = "app_rust"
version = "0.1.0"
edition = "2024"

[profile.dev]
debug = 1
split-debuginfo = "unpacked"
codegen-units = 256
incremental=false
opt-level=0

[dependencies]
rand = "0.10.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
sqlx = { version = "0.8", features = ["sqlite","runtime-tokio","macros","migrate"], default-features = false }
tokio = { version = "1.49.0", features = ["rt-multi-thread", "macros", "signal"] }
anyhow = "1.0.101"
serde_json = "1.0"
axum = { version = "0.8.9" }
serde = { version = "1.0.228", features = ["derive"] }
thiserror = "1.0"
uuid = { version = "1.24.0", features = ["v4", "serde"]  }

[[bin]]
name = "api_rest"
path = "src/app.rs"

[[bin]]
name = "main"
path = "src/main.rs"
