info:
  name: cria um novo usuario
  type: http
  seq: 1

http:
  method: POST
  url: http://localhost:8080/api/users
  body:
    type: json
    data: |-
      {
        "username": "Teste3",
        "email": "teste2@teste.com",
        "age": 3,
        "user_id": "{{userId}}"
      }
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        const { v4: uuidv4 } = require('uuid');
        bru.setVar('userId', uuidv4());
    - type: after-response
      code: bru.setVar("username", res.body.username);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
