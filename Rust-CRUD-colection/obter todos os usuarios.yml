info:
  name: obter todos os usuarios
  type: http
  seq: 2

http:
  method: GET
  url: http://localhost:8080/api/users
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const body = res.getBody();
        bru.setVar("user_id", body[0].user_id);
        console.log("user_id:", body[0].user_id);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
